<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>What Should I Learn Today?</title>
      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <h1>What Should I Learn Today?</h1>
            <button id="spinnerButton">Spin!</button>
            <div id="result"></div>
            <button id="unlockButton" disabled>Unlock Early</button>
        </div>
        <div id="puzzleSection" class="hidden container">
            <p id="puzzleQuestion">🧠 Solve: </p>
            <input type="number" id="puzzleInput" />
            <br><br>
            <button id="submitPuzzle">Submit Answer</button>
            <p id="puzzleFeedback"></p>
        </div>
      <script src="script.js"></script>
    </body>
</html>
